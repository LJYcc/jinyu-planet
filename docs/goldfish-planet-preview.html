<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="金鱼星球，一个可以阅读、写作和聊天的小小数字星球。" />
    <title>金鱼星球 | Goldfish Planet</title>
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <style>
      @font-face {
        font-family: 'Goldfish Sans';
        src: url('../public/fonts/NotoSansSC-Regular.woff2') format('woff2');
        font-style: normal;
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: 'Goldfish Sans';
        src: url('../public/fonts/NotoSansSC-Medium.woff2') format('woff2');
        font-style: normal;
        font-weight: 500;
        font-display: swap;
      }
      @font-face {
        font-family: 'Goldfish Sans';
        src: url('../public/fonts/NotoSansSC-SemiBold.woff2') format('woff2');
        font-style: normal;
        font-weight: 600 900;
        font-display: swap;
      }
      :root {
        --ink: #15231e;
        --green: #1f3830;
        --deep: #0b211d;
        --paper: #fffef9;
        --fog: #f1f2ed;
        --line: #d5dad3;
        --muted: #69736c;
        --lime: #dbe950;
        --gold: #e8c85c;
        --rose: #e9c6b8;
        --sky: #cddde2;
        --radius: 5px;
      }

      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        color: var(--ink);
        background: var(--fog);
        font-family: 'Goldfish Sans', 'Microsoft YaHei', sans-serif;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      img {
        display: block;
        max-width: 100%;
      }
      .shell {
        width: min(1120px, calc(100% - 48px));
        margin: 0 auto;
      }
      .mono {
        font:
          11px/1.4 'Cascadia Mono',
          Consolas,
          monospace;
        letter-spacing: 0.08em;
      }
      .eyebrow {
        color: var(--muted);
        font:
          500 10px/1.3 'Cascadia Mono',
          Consolas,
          monospace;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      .page {
        min-height: 100vh;
      }
      .site-nav {
        height: 70px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 11px;
        font:
          700 14px 'Goldfish Sans',
          sans-serif;
        letter-spacing: 0.07em;
        white-space: nowrap;
      }
      .brand-mark {
        display: grid;
        place-items: center;
        width: 45px;
        height: 23px;
        border: 1px solid currentColor;
        font:
          500 8px 'Cascadia Mono',
          Consolas,
          monospace;
        letter-spacing: 0.06em;
      }
      .nav-links {
        display: flex;
        align-items: center;
        gap: 22px;
      }
      .nav-links a {
        padding: 8px 0;
        border-bottom: 1px solid transparent;
        font:
          500 10px 'Cascadia Mono',
          Consolas,
          monospace;
        letter-spacing: 0.06em;
        white-space: nowrap;
      }
      .nav-links a:hover,
      .nav-links a.active {
        color: var(--lime);
        border-bottom-color: currentColor;
      }
      .nav-trigger {
        display: none;
        border: 0;
        color: inherit;
        background: none;
      }
      .button {
        display: inline-flex;
        min-height: 42px;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px 15px;
        border: 1px solid transparent;
        border-radius: var(--radius);
        background: var(--lime);
        color: var(--ink);
        font:
          600 11px 'Goldfish Sans',
          sans-serif;
        letter-spacing: 0.03em;
      }
      .button:hover {
        background: #e6f469;
      }
      .button.ghost {
        border-color: currentColor;
        background: transparent;
        color: inherit;
      }
      .button.ghost:hover {
        background: rgba(255, 255, 255, 0.12);
      }
      .button.dark {
        background: var(--green);
        color: #fff;
      }
      .button.dark:hover {
        background: var(--deep);
      }
      .button.small {
        min-height: 34px;
        padding: 7px 10px;
        font-size: 10px;
      }
      .ai-fab {
        position: fixed;
        right: 24px;
        bottom: 24px;
        z-index: 10;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 46px;
        padding: 0 15px;
        border: 1px solid var(--ink);
        border-radius: var(--radius);
        background: var(--paper);
        color: var(--ink);
        box-shadow: 4px 4px 0 var(--ink);
        font:
          600 11px 'Goldfish Sans',
          sans-serif;
      }
      .ai-fab:hover {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0 var(--ink);
      }
      .section {
        padding: 78px 0;
      }
      .section-head {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 26px;
        padding-bottom: 18px;
        border-bottom: 1px solid var(--line);
      }
      .section-head h2 {
        margin: 8px 0 0;
        font:
          600 29px/1.15 'Goldfish Sans',
          sans-serif;
        letter-spacing: 0;
      }
      .section-head p {
        max-width: 300px;
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.8;
        text-align: right;
      }
      .tag {
        display: inline-flex;
        align-items: center;
        min-height: 25px;
        padding: 4px 8px;
        border-radius: 2px;
        background: var(--lime);
        color: var(--ink);
        font:
          10px 'Cascadia Mono',
          Consolas,
          monospace;
        letter-spacing: 0.04em;
      }
      .tag.rose {
        background: var(--rose);
      }
      .tag.sky {
        background: var(--sky);
      }
      .empty {
        padding: 56px 24px;
        border: 1px dashed #aeb8b0;
        text-align: center;
        color: var(--muted);
      }
      .empty h2 {
        margin: 0 0 8px;
        color: var(--ink);
        font-size: 20px;
      }
      .empty p {
        margin: 0 0 18px;
        font-size: 13px;
      }

      /* Home */
      .home-hero {
        min-height: 625px;
        color: #fff;
        background:
          linear-gradient(rgba(4, 20, 20, 0.53), rgba(4, 20, 20, 0.64)),
          url('https://images.unsplash.com/photo-1519608487953-e999c86e7454?auto=format&fit=crop&w=2200&q=88') center
            54% / cover;
      }
      .home-hero .site-nav {
        border-bottom: 1px solid rgba(255, 255, 255, 0.24);
      }
      .home-hero .eyebrow {
        color: rgba(255, 255, 255, 0.72);
      }
      .hero-body {
        min-height: 485px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 55px 0;
        text-align: center;
      }
      .orbital-mark {
        display: grid;
        place-items: center;
        width: 52px;
        height: 52px;
        margin-bottom: 21px;
        border: 1px solid rgba(255, 255, 255, 0.75);
        border-radius: 50%;
        color: var(--lime);
        font:
          10px/1.1 'Cascadia Mono',
          Consolas,
          monospace;
      }
      .hero-body h1 {
        max-width: 900px;
        margin: 0;
        font:
          700 clamp(50px, 10vw, 118px)/0.9 'Goldfish Sans',
          sans-serif;
        letter-spacing: 0.04em;
      }
      .hero-body p {
        max-width: 460px;
        margin: 22px 0 26px;
        color: rgba(255, 255, 255, 0.8);
        font-size: 14px;
        line-height: 1.9;
      }
      .hero-meta {
        display: flex;
        justify-content: space-between;
        padding: 0 0 19px;
        color: rgba(255, 255, 255, 0.66);
      }
      .hero-meta span:last-child {
        color: var(--lime);
      }
      .intro {
        background: var(--paper);
      }
      .intro-grid {
        display: grid;
        grid-template-columns: 0.72fr 1.28fr;
        gap: 88px;
        align-items: start;
      }
      .planet-card {
        display: flex;
        width: 170px;
        min-height: 228px;
        flex-direction: column;
        justify-content: space-between;
        padding: 17px;
        border: 2px solid #8b9990;
        background: var(--fog);
      }
      .planet-card strong {
        font:
          600 44px/0.83 'Goldfish Sans',
          sans-serif;
        letter-spacing: 0.08em;
      }
      .planet-card span {
        font:
          10px/1.5 'Cascadia Mono',
          Consolas,
          monospace;
      }
      .intro-copy h2 {
        margin: 12px 0 18px;
        font:
          600 clamp(27px, 3vw, 39px)/1.28 'Goldfish Sans',
          sans-serif;
      }
      .intro-copy p {
        max-width: 560px;
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.95;
      }
      .intro-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-top: 28px;
      }
      .signal-grid {
        display: grid;
        grid-template-columns: 1.15fr 0.85fr 0.85fr;
        grid-auto-rows: 220px;
        margin-top: 26px;
      }
      .signal {
        position: relative;
        overflow: hidden;
        display: flex;
        min-width: 0;
        flex-direction: column;
        justify-content: flex-end;
        padding: 21px;
        background: #d2d8d2;
        color: #fff;
      }
      .signal::before {
        position: absolute;
        inset: 0;
        background: rgba(10, 30, 25, 0.24);
        content: '';
        transition: background 0.2s;
      }
      .signal:hover::before {
        background: rgba(10, 30, 25, 0.42);
      }
      .signal img {
        position: absolute;
        inset: 0;
        z-index: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .signal > * {
        position: relative;
        z-index: 1;
      }
      .signal.main {
        grid-row: span 2;
      }
      .signal.main h3 {
        font-size: 25px;
      }
      .signal h3 {
        margin: 10px 0 4px;
        font-size: 16px;
        line-height: 1.55;
      }
      .signal .meta {
        color: rgba(255, 255, 255, 0.8);
        font:
          10px 'Cascadia Mono',
          Consolas,
          monospace;
      }
      .signal.plain {
        background: var(--paper);
        color: var(--ink);
      }
      .signal.plain::before {
        display: none;
      }
      .signal.plain .meta {
        color: var(--muted);
      }
      .signal.plain h3 {
        margin-top: auto;
      }
      .topics-band {
        background: #e6eeea;
      }
      .topics-layout {
        display: grid;
        grid-template-columns: 0.95fr 1.05fr;
        gap: 62px;
        align-items: center;
      }
      .topic-image {
        min-height: 365px;
        background: url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1000&q=85')
          center / cover;
        filter: grayscale(58%);
      }
      .topics-copy h2 {
        margin: 9px 0 25px;
        font:
          600 34px/1.25 'Goldfish Sans',
          sans-serif;
      }
      .topic-list {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 22px;
      }
      .topic-item {
        padding: 17px 0;
        border-top: 1px solid #b6c3bb;
      }
      .topic-item:nth-last-child(-n + 2) {
        border-bottom: 1px solid #b6c3bb;
      }
      .topic-item b {
        color: #74847a;
        font:
          11px 'Cascadia Mono',
          Consolas,
          monospace;
      }
      .topic-item h3 {
        margin: 7px 0 4px;
        font-size: 15px;
      }
      .topic-item p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.7;
      }
      .landing-band {
        color: #fff;
        background: var(--deep);
      }
      .landing-band .section-head {
        border-color: #506259;
      }
      .landing-band .section-head h2 {
        color: #fff;
      }
      .landing-band .section-head p {
        color: #bdc9c1;
      }
      .landing-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1px;
        margin-top: 26px;
        background: #506259;
      }
      .landing {
        min-height: 248px;
        display: flex;
        flex-direction: column;
        padding: 24px;
        background: var(--deep);
      }
      .landing:first-child {
        background: #1b3129;
      }
      .landing .eyebrow {
        color: var(--lime);
      }
      .landing h3 {
        margin: 15px 0;
        font-size: 20px;
        line-height: 1.55;
      }
      .landing p {
        margin: 0;
        color: #bfcbc3;
        font-size: 12px;
        line-height: 1.8;
      }
      .landing a {
        margin-top: auto;
        color: var(--lime);
        font:
          11px 'Cascadia Mono',
          Consolas,
          monospace;
      }
      .bottle {
        background: var(--paper);
      }
      .bottle-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 28px;
        padding: 42px 0;
      }
      .bottle-inner h2 {
        margin: 6px 0 0;
        font:
          600 26px 'Goldfish Sans',
          sans-serif;
      }
      .bottle-inner p {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      /* Shared secondary pages */
      .sub-header {
        color: #fff;
        background: var(--green);
      }
      .sub-header .site-nav {
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      }
      .sub-header .eyebrow {
        color: rgba(255, 255, 255, 0.66);
      }
      .sub-hero {
        padding: 70px 0 63px;
      }
      .sub-hero h1 {
        max-width: 780px;
        margin: 12px 0 12px;
        font:
          600 clamp(41px, 7vw, 76px)/1 'Goldfish Sans',
          sans-serif;
        letter-spacing: 0.02em;
      }
      .sub-hero p {
        max-width: 555px;
        margin: 0;
        color: rgba(255, 255, 255, 0.75);
        font-size: 14px;
        line-height: 1.85;
      }
      .surface {
        background: var(--paper);
      }
      .page-section {
        padding: 57px 0 86px;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-bottom: 24px;
      }
      .search {
        display: flex;
        min-width: min(100%, 255px);
        align-items: center;
        gap: 8px;
        padding: 0 12px;
        border: 1px solid var(--line);
        background: #fff;
      }
      .search input {
        width: 100%;
        height: 39px;
        border: 0;
        outline: 0;
        background: transparent;
        font-size: 12px;
      }
      .filter {
        min-height: 39px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 0;
        background: #fff;
        color: var(--ink);
        font-size: 12px;
      }
      .tool-spacer {
        flex: 1;
      }
      .post-list {
        border-top: 2px solid var(--ink);
      }
      .post-row {
        display: grid;
        grid-template-columns: 116px 1fr auto;
        gap: 22px;
        align-items: center;
        padding: 23px 0;
        border-bottom: 1px solid var(--line);
      }
      .post-row:hover .post-title {
        text-decoration: underline;
        text-underline-offset: 5px;
      }
      .post-date {
        color: var(--muted);
        font:
          10px/1.6 'Cascadia Mono',
          Consolas,
          monospace;
      }
      .post-title {
        margin: 0 0 6px;
        font-size: 18px;
        line-height: 1.45;
      }
      .post-excerpt {
        max-width: 650px;
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.75;
      }
      .post-meta {
        display: flex;
        min-width: 135px;
        flex-direction: column;
        align-items: flex-end;
        gap: 7px;
        color: var(--muted);
        font:
          10px 'Cascadia Mono',
          Consolas,
          monospace;
        text-align: right;
      }
      .pagination {
        display: flex;
        justify-content: center;
        gap: 8px;
        padding-top: 30px;
      }
      .pagination button {
        width: 34px;
        height: 34px;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
      }
      .pagination button.current {
        border-color: var(--ink);
        background: var(--ink);
        color: #fff;
      }

      /* Detail */
      .article-shell {
        width: min(770px, calc(100% - 48px));
        margin: 0 auto;
      }
      .article-head {
        padding: 65px 0 35px;
      }
      .article-head h1 {
        margin: 15px 0 14px;
        font:
          600 clamp(30px, 5vw, 55px)/1.23 'Goldfish Sans',
          sans-serif;
      }
      .article-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 13px;
        color: var(--muted);
        font:
          10px 'Cascadia Mono',
          Consolas,
          monospace;
      }
      .article-cover {
        width: 100%;
        max-height: 460px;
        object-fit: cover;
      }
      .article-body {
        padding: 40px 0 66px;
        font-size: 16px;
        line-height: 2;
      }
      .article-body h2 {
        margin: 38px 0 13px;
        font:
          600 25px/1.4 'Goldfish Sans',
          sans-serif;
      }
      .article-body p {
        margin: 0 0 19px;
      }
      .article-body blockquote {
        margin: 26px 0;
        padding: 14px 20px;
        border-left: 3px solid var(--gold);
        background: #f4f3ed;
        color: #49544c;
      }
      .article-body code {
        padding: 2px 5px;
        background: #edf0eb;
        font:
          12px 'Cascadia Mono',
          Consolas,
          monospace;
      }
      .article-footer {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 23px 0 76px;
        border-top: 1px solid var(--line);
      }

      /* Write */
      .write-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 260px;
        gap: 44px;
        align-items: start;
      }
      .editor-card {
        padding: 24px;
        border: 1px solid var(--line);
        background: #fff;
      }
      .field {
        display: grid;
        gap: 8px;
        margin-bottom: 19px;
      }
      .field label {
        font:
          500 10px 'Cascadia Mono',
          Consolas,
          monospace;
        letter-spacing: 0.08em;
      }
      .field input,
      .field select {
        width: 100%;
        height: 43px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 0;
        outline-color: var(--green);
        background: #fff;
        font-size: 14px;
      }
      .editor-tools {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        padding: 8px;
        border: 1px solid var(--line);
        border-bottom: 0;
        background: var(--fog);
      }
      .editor-tools button {
        display: grid;
        width: 31px;
        height: 29px;
        place-items: center;
        border: 0;
        background: transparent;
        color: var(--ink);
        font-weight: 700;
      }
      .editor-tools button:hover {
        background: #dce3db;
      }
      .rich-editor {
        min-height: 280px;
        padding: 16px;
        border: 1px solid var(--line);
        outline: 0;
        font-size: 14px;
        line-height: 1.85;
      }
      .rich-editor:empty::before {
        color: #9aa49d;
        content: attr(data-placeholder);
        pointer-events: none;
      }
      .write-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: flex-end;
        margin-top: 20px;
      }
      .identity-card {
        padding: 20px;
        border-top: 3px solid var(--ink);
        background: #e9efea;
      }
      .identity-card h2 {
        margin: 7px 0 9px;
        font-size: 20px;
        line-height: 1.3;
      }
      .identity-card p {
        margin: 0 0 15px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.75;
      }
      .identity-name {
        display: inline-block;
        margin: 4px 0 14px;
        padding: 6px 7px;
        background: var(--lime);
        font:
          11px 'Cascadia Mono',
          Consolas,
          monospace;
      }
      .notice {
        margin-top: 22px;
        padding: 15px;
        border: 1px solid var(--line);
        color: var(--muted);
        font-size: 12px;
        line-height: 1.75;
      }
      .preview-panel {
        display: none;
        margin-top: 18px;
        padding: 20px;
        border: 1px dashed #89968d;
        background: #f8f8f4;
      }
      .preview-panel.visible {
        display: block;
      }
      .preview-panel h2 {
        margin: 10px 0;
        font-size: 26px;
      }

      /* AI */
      .chat-layout {
        display: grid;
        min-height: calc(100vh - 70px);
        grid-template-columns: 255px minmax(0, 1fr);
        background: var(--paper);
      }
      .chat-side {
        display: flex;
        min-height: calc(100vh - 70px);
        flex-direction: column;
        padding: 20px;
        border-right: 1px solid var(--line);
        background: #edf0ea;
      }
      .chat-side .button {
        width: 100%;

        const query = new URLSearchParams(location.hash.split('?')[1] || '');
        const selected = query.get('topic') || '全部主题';
        app.innerHTML = `${pageHeader('星球广场', '所有公开信号都在这里着陆。随便逛逛，或者用一个关键词寻找正在和你共振的句子。', '/posts')}<section class="surface"><div class="shell page-section"><div class="toolbar"><label class="search"><i data-lucide="search" width="16" height="16"></i><input id="post-search" type="search" placeholder="搜索标题、文字或昵称" /></label><select id="topic-filter" class="filter" aria-label="按主题筛选">${['全部主题', '生活碎片', '技术与产品', '城市观察', '脑内宇宙', '好东西分享'].map(topic => `<option ${topic === selected ? 'selected' : ''}>${topic}</option>`).join('')}</select><select id="sort-filter" class="filter" aria-label="排序方式"><option>最新</option><option>推荐</option></select><span class="tool-spacer"></span><a class="button dark small" href="#/write"><i data-lucide="pen-line" width="14" height="14"></i>投递信号</a></div><div id="post-list" class="post-list"></div><div class="pagination"><button class="current">1</button><button aria-label="下一页">2</button><button aria-label="下一页"><i data-lucide="arrow-right" width="15" height="15"></i></button></div></div></section>${footer()}`;
        const list = document.getElementById('post-list');
        function updateList() {
          const term = document.getElementById('post-search').value.trim().toLowerCase();
          const topic = document.getElementById('topic-filter').value;
          let posts = allPosts().filter(
            post =>
              (topic === '全部主题' || post.topic === topic) &&
              (!term || `${post.title} ${post.excerpt} ${post.author}`.toLowerCase().includes(term))
          );
          if (document.getElementById('sort-filter').value === '推荐')
            posts = [...posts].sort((a, b) => (a.id === 'orbit-001' ? -1 : b.id === 'orbit-001' ? 1 : 0));
          list.innerHTML = posts.length
            ? posts.map(postRow).join('')
            : `<div class="empty"><h2>还没有找到信号</h2><p>换个关键词，或去投递第一条内容。</p><a class="button dark small" href="#/write">去写一条</a></div>`;
          icons();
        }
        document.getElementById('post-search').addEventListener('input', updateList);
        document.getElementById('topic-filter').addEventListener('change', updateList);
        document.getElementById('sort-filter').addEventListener('change', updateList);
        updateList();
      }

      function renderPostDetail(id) {
        const post = allPosts().find(item => item.id === id);
        if (!post) {
          app.innerHTML = `${pageHeader('信号飘走了', '这个地址没有找到对应内容。也许它还没有抵达，或已经去了别的轨道。', '/posts')}<section class="surface"><div class="article-shell page-section"><div class="empty"><h2>404 / 信号未找到</h2><p>回到广场，看看其他正在发光的内容。</p><a class="button dark small" href="#/posts">回到星球广场</a></div></div></section>${footer()}`;
          return;
        }
        const related = allPosts()
          .filter(item => item.topic === post.topic && item.id !== post.id)
          .slice(0, 2);
        app.innerHTML = `${pageHeader(post.topic, '来自金鱼星球的一条公开信号。', '/posts')}<article class="surface"><div class="article-shell"><header class="article-head">${topicTag(post.topic)}<h1>${post.title}</h1><div class="article-meta"><span>${post.author}</span><span>${post.date}</span><span>${post.minutes}</span><span>${post.type}</span></div></header>${post.image ? `<img class="article-cover" src="${post.image}" alt="${post.title}" />` : ''}<div class="article-body">${post.body}</div><div class="article-footer"><a class="button ghost" href="#/posts"><i data-lucide="arrow-left" width="15" height="15"></i>回到星球广场</a><button id="copy-link" class="button dark"><i data-lucide="link" width="15" height="15"></i>复制链接</button></div>${related.length ? `<section class="related"><span class="eyebrow">SAME ORBIT</span><h2>同一轨道的信号</h2><div class="post-list">${related.map(postRow).join('')}</div></section>` : ''}</div></article>${footer()}`;
        document.getElementById('copy-link').addEventListener('click', async event => {
          try {
            await navigator.clipboard.writeText(location.href);
            event.currentTarget.innerHTML = '<i data-lucide="check" width="15" height="15"></i>已复制';
            icons();
          } catch {
            event.currentTarget.textContent = '复制失败';
          }
        });
      }

      function renderWrite() {
        app.innerHTML = `${pageHeader('投递新信号', '不需要注册。用系统给你的昵称，留下此刻想被好好接住的一段话。', '/write')}<section class="surface"><div class="shell page-section"><div class="write-layout"><form id="write-form" class="editor-card"><div class="field"><label for="post-type">信号类型</label><select id="post-type"><option>长文</option><option>短帖</option><option>图文</option><option>链接分享</option></select></div><div class="field"><label for="post-topic">星球主题</label><select id="post-topic">${['生活碎片', '技术与产品', '城市观察', '脑内宇宙', '好东西分享'].map(topic => `<option>${topic}</option>`).join('')}</select></div><div class="field"><label for="post-title">标题 <span class="mono" style="color:var(--muted)">短帖可不填</span></label><input id="post-title" maxlength="80" placeholder="给这条信号一个名字" /></div><div class="field"><label>正文</label><div class="editor-tools" aria-label="富文本工具栏"><button type="button" data-command="bold" title="加粗"><b>B</b></button><button type="button" data-command="italic" title="斜体"><i>I</i></button><button type="button" data-command="strikeThrough" title="删除线"><s>S</s></button><button type="button" data-command="formatBlock" data-value="h2" title="二级标题">H2</button><button type="button" data-command="insertUnorderedList" title="无序列表"><i data-lucide="list" width="16" height="16"></i></button><button type="button" data-command="insertOrderedList" title="有序列表"><i data-lucide="list-ordered" width="16" height="16"></i></button><button type="button" data-command="formatBlock" data-value="blockquote" title="引用"><i data-lucide="quote" width="16" height="16"></i></button><button type="button" id="add-link" title="插入链接"><i data-lucide="link" width="16" height="16"></i></button></div><div id="rich-editor" class="rich-editor" contenteditable="true" data-placeholder="从这里开始写。一个念头、一段观察，或者一个想分享的链接。"></div></div><div class="write-actions"><button type="button" id="preview-button" class="button ghost">预览</button><button type="submit" class="button dark"><i data-lucide="send" width="15" height="15"></i>投递到金鱼星球</button></div><div id="preview-panel" class="preview-panel"></div></form><aside><div class="identity-card"><span class="eyebrow">YOUR TEMPORARY IDENTITY</span><h2>你正在使用这个昵称</h2><div id="identity-name" class="identity-name">${getNickname()}</div><p>昵称只保存在当前浏览器。换一个昵称不会修改以前发出的内容。</p><button id="change-nickname" class="button small ghost">换一个昵称 <i data-lucide="refresh-cw" width="14" height="14"></i></button></div><div class="notice"><strong>投递前请确认</strong><br />请不要发布密码、身份证号、精确地址等个人隐私，也不要发布攻击性或违法内容。正式接入数据服务时，站点会加入发布频率与内容状态管理。</div></aside></div></div></section>${footer()}`;
        const editor = document.getElementById('rich-editor');
        const draft = safeGet('goldfish-draft', null);
        if (draft) {
          document.getElementById('post-title').value = draft.title || '';
          document.getElementById('post-type').value = draft.type || '长文';
          document.getElementById('post-topic').value = draft.topic || '生活碎片';
          editor.innerHTML = draft.body || '';
        }
        function storeDraft() {
          safeSet('goldfish-draft', {
            title: document.getElementById('post-title').value,
            type: document.getElementById('post-type').value,
            topic: document.getElementById('post-topic').value,
            body: editor.innerHTML
          });
        }
        editor.addEventListener('input', storeDraft);
        document.getElementById('post-title').addEventListener('input', storeDraft);
        document.querySelectorAll('[data-command]').forEach(button =>
          button.addEventListener('click', () => {
            editor.focus();
            document.execCommand(button.dataset.command, false, button.dataset.value || null);
            storeDraft();
          })
        );
        document.getElementById('add-link').addEventListener('click', () => {
          const url = prompt('请输入链接地址（https://...）');
          if (url) {
            editor.focus();
            document.execCommand('createLink', false, url);
            storeDraft();
          }
        });
        document.getElementById('change-nickname').addEventListener('click', () => {
          document.getElementById('identity-name').textContent = replaceNickname();
        });
        document.getElementById('preview-button').addEventListener('click', () => {
          const title =
            document.getElementById('post-title').value ||
            editor.textContent.trim().slice(0, 28) ||
            '一条还没命名的信号';
          const panel = document.getElementById('preview-panel');
          panel.classList.add('visible');
          panel.innerHTML = `${topicTag(document.getElementById('post-topic').value)}<h2>${title}</h2><div class="article-meta"><span>${getNickname()}</span><span>预览模式</span></div><div class="article-body">${editor.innerHTML || '<p>正文会在这里出现。</p>'}</div>`;
        });
        document.getElementById('write-form').addEventListener('submit', event => {
          event.preventDefault();
          const body = editor.innerHTML.trim();
          const text = editor.textContent.trim();
          const title = document.getElementById('post-title').value.trim() || text.slice(0, 28);
          if (!text) {
            editor.focus();
            alert('先写下一点内容，再投递吧。');
            return;
          }
          const post = {
            id: `local-${Date.now()}`,
            type: document.getElementById('post-type').value,
            topic: document.getElementById('post-topic').value,
            title,
            excerpt: text.slice(0, 76) + (text.length > 76 ? '…' : ''),
            author: getNickname(),
            date: new Date().toLocaleDateString('zh-CN').replaceAll('/', '.'),
            minutes: `${Math.max(1, Math.ceil(text.length / 350))
              .toString()
              .padStart(2, '0')} 分钟`,
            image: '',
            body
          };
          const localPosts = safeGet('goldfish-posts', []);
          localPosts.unshift(post);
          safeSet('goldfish-posts', localPosts);
          safeSet('goldfish-draft', null);
          location.hash = `#/posts/${post.id}`;
        });
      }

      function renderChat() {
        app.innerHTML = `<section class="sub-header">${nav('/ai-chat', true)}</section><section class="chat-layout"><aside class="chat-side"><button id="new-chat" class="button dark"><i data-lucide="square-pen" width="15" height="15"></i>新建对话</button><div class="chat-history"><h2>当前会话</h2><button class="history-item">关于金鱼星球的第一句问候</button></div><p class="chat-disclaimer">这是 AI Chat 的静态界面预览。千问 SDK 接入后，消息会由真实模型生成。</p></aside><main class="chat-main"><header class="chat-top"><strong>AI 助理</strong><span class="chat-status">SERVICE NOT CONNECTED</span></header><div id="messages" class="messages"><div class="welcome"><span class="eyebrow">GOLDFISH PLANET AI</span><h1>想聊点什么？</h1><p>这里会是一个通用 AI Chat。千问服务接入后，你可以问任何问题；现在先看看完整的对话界面与消息状态。</p><div class="suggestions"><button>帮我整理一下今天的想法</button><button>解释一个技术概念</button><button>给我一个周末去处的灵感</button></div></div></div><div class="composer-wrap"><form id="chat-form" class="composer"><textarea id="chat-input" placeholder="给 AI 助理发消息..." aria-label="聊天内容"></textarea><button class="send" type="submit" aria-label="发送消息"><i data-lucide="arrow-up" width="18" height="18"></i></button></form></div></main></section>`;
        const messages = document.getElementById('messages');
        const input = document.getElementById('chat-input');
        function send(text) {
          if (!text.trim()) return;
          messages.insertAdjacentHTML(
            'beforeend',
            `<div class="message user">${escapeHtml(text.trim())}</div><div class="message system">千问服务尚未接入。这条消息已在当前页面收到；接入 SDK 后，AI 会在这里给出真实回答。</div>`
          );
          input.value = '';
          messages.lastElementChild.scrollIntoView({ behavior: 'smooth', block: 'end' });
        }
        document.getElementById('chat-form').addEventListener('submit', event => {
          event.preventDefault();
          send(input.value);
        });
        document
          .querySelectorAll('.suggestions button')
          .forEach(button => button.addEventListener('click', () => send(button.textContent)));
        document.getElementById('new-chat').addEventListener('click', () => {
          messages.innerHTML = `<div class="welcome"><span class="eyebrow">NEW CONVERSATION</span><h1>新的对话，新的轨道。</h1><p>服务接入后，消息会在这里开始。</p></div>`;
        });
      }
      function escapeHtml(value) {
        const div = document.createElement('div');
        div.textContent = value;
        return div.innerHTML;
      }

      function renderAbout() {
        app.innerHTML = `${pageHeader('关于这颗星球', '一个由个人发起、向所有路过者开放的中文网页。没有注册，也没有复杂的人设。', '/about')}<section class="surface"><div class="shell page-section"><div class="about-grid"><div class="about-card"><span class="eyebrow" style="color:#c4d1ca">GOLDFISH PLANET</span><strong>OPEN<br />SIGNALS</strong></div><div class="about-copy"><span class="eyebrow">A NOTE FROM THE HOST</span><h2>给还没有想好怎么自我介绍的人，也留一个位置。</h2><p>金鱼星球由一个喜欢记录、技术和交流的人发起。正式头像、个人介绍和外部链接将在后续替换；目前先让内容和偶然相遇发生。</p><p>这个网站不要求你创建账户。它只在这一次浏览里，给你一个轻巧的名字，让你可以选择留下些什么。</p><div class="rule-list"><div class="rule"><b>01</b><p>匿名不代表没有边界。请尊重他人，也保护自己的隐私。</p></div><div class="rule"><b>02</b><p>这里欢迎完整的文章，也欢迎短短一句还没整理好的感受。</p></div><div class="rule"><b>03</b><p>AI 助理将由千问 SDK 驱动。服务接入前，页面不会假装生成真实回答。</p></div></div></div></div></div></section>${footer()}`;
      }

      function icons() {
        if (window.lucide) window.lucide.createIcons();
      }
      function bindNav() {
        const trigger = document.querySelector('[data-menu]');
        const links = document.querySelector('[data-nav]');
        if (trigger && links) trigger.addEventListener('click', () => links.classList.toggle('open'));
      }
      function render() {
        const current = route();
        window.scrollTo(0, 0);
        if (current === '/' || current === '') renderHome();
        else if (current.startsWith('/posts/')) renderPostDetail(current.split('/')[2]);
        else if (current.startsWith('/posts')) renderPosts();
        else if (current === '/write') renderWrite();
        else if (current === '/ai-chat') renderChat();
        else if (current === '/about') renderAbout();
        else renderPostDetail('missing');
        icons();
        bindNav();
      }
      window.addEventListener('hashchange', render);
      render();
    </script>
  </body>
</html>

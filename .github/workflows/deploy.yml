# GitHub Actions：推送 prod 分支后构建镜像、推送 GHCR，再 SSH 部署到服务器。
name: Build and deploy

# 只有 prod 分支的推送会触发生产部署。
on:
  # 允许在 GitHub Actions 页面手动触发生产部署。
  workflow_dispatch:
  push:
    branches:
      - prod

# 工作流内置 GITHUB_TOKEN 仅用于读取源码和推送镜像到 GHCR。
permissions:
  contents: read
  packages: write

# 同一时刻只允许一个生产部署，避免两个提交并发修改同一台服务器。
concurrency:
  group: jinyu-planet-production
  cancel-in-progress: false

# 所有镜像统一发布到 GitHub Container Registry。
env:
  REGISTRY: ghcr.io

jobs:
  # 在构建镜像前先安装锁定版本的依赖并执行 ESLint。
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:eslint

  build-and-deploy:
    name: Build and deploy
    needs: lint
    runs-on: ubuntu-24.04
    # production 环境中的 Secrets 只会在此 Job 中注入。
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Define image names
        id: image
        shell: bash
        run: |
          # GHCR 镜像名称必须为小写；提交 SHA 用于部署精确版本和回滚。
          echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN 只在 Actions 内使用，服务器拉私有镜像使用 GHCR_TOKEN。
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push application image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          # runtime target 只包含 Nuxt 的运行产物；latest 便于识别，SHA 是实际部署版本。
          docker build --target runtime --tag "$IMAGE:$TAG" --tag "$IMAGE:latest" .
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"

      - name: Build and push migration image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          # migration target 包含 Prisma CLI，仅用于一次性的结构迁移与主题初始化。
          docker build --target migration --tag "$IMAGE:$TAG-migrate" .
          docker push "$IMAGE:$TAG-migrate"

      - name: Deploy on production server
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          TAG: ${{ steps.image.outputs.tag }}
          # 连接目标和账号不是凭据，使用 production Environment Variables 管理。
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_USERNAME: ${{ vars.SSH_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          # 主机公钥和 GHCR 用户名均可公开；令牌仍必须是 Secret。
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SHADOW_DATABASE_URL: ${{ secrets.SHADOW_DATABASE_URL }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          # 模型行为和服务地址不包含凭据，使用 production Environment Variables。
          QWEN_BASE_URL: ${{ vars.QWEN_BASE_URL }}
          QWEN_MODEL: ${{ vars.QWEN_MODEL }}
          QWEN_TIMEOUT_MS: ${{ vars.QWEN_TIMEOUT_MS }}
          QWEN_DEEP_THINKING_ENABLED: ${{ vars.QWEN_DEEP_THINKING_ENABLED }}
          QWEN_WEB_SEARCH_ENABLED: ${{ vars.QWEN_WEB_SEARCH_ENABLED }}
          ALI_OSS_BUCKET: ${{ vars.ALI_OSS_BUCKET }}
          ALI_OSS_REGION: ${{ vars.ALI_OSS_REGION }}
          ALI_OSS_ENDPOINT: ${{ vars.ALI_OSS_ENDPOINT }}
          ALI_OSS_ACCESS_KEY_ID: ${{ secrets.ALI_OSS_ACCESS_KEY_ID }}
          ALI_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALI_OSS_ACCESS_KEY_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          echo "===== checking GitHub Environment configuration ====="
          # 只输出配置名和是否存在，不输出任何值；缺失时在部署开始前直接失败。
          for deploy_value_name in SSH_HOST SSH_PORT SSH_USERNAME SSH_PRIVATE_KEY SSH_KNOWN_HOSTS GHCR_USERNAME GHCR_TOKEN DATABASE_URL SHADOW_DATABASE_URL QWEN_API_KEY QWEN_BASE_URL QWEN_MODEL QWEN_TIMEOUT_MS QWEN_DEEP_THINKING_ENABLED QWEN_WEB_SEARCH_ENABLED ALI_OSS_BUCKET ALI_OSS_REGION ALI_OSS_ENDPOINT ALI_OSS_ACCESS_KEY_ID ALI_OSS_ACCESS_KEY_SECRET; do
            deploy_value="${!deploy_value_name:-}"
            if [[ -n "$deploy_value" ]]; then
              echo "$deploy_value_name: present"
            else
              echo "::error::$deploy_value_name is empty in the Deploy on production server step"
              exit 1
            fi
          done
          # 配置错误应在部署前失败，避免应用带着空值启动后静默关闭能力。
          if [[ -z "${QWEN_API_KEY//[[:space:]]/}" ]]; then
            echo '::error::QWEN_API_KEY is empty. Configure it as a Secret in the production Environment.'
            exit 1
          fi
          for ai_flag_name in QWEN_DEEP_THINKING_ENABLED QWEN_WEB_SEARCH_ENABLED; do
            ai_flag_value="${!ai_flag_name}"
            if [[ "$ai_flag_value" != 'true' && "$ai_flag_value" != 'false' ]]; then
              echo "::error::$ai_flag_name must be exactly true or false; received an empty or invalid value."
              exit 1
            fi
          done
          install -d -m 700 ~/.ssh
          # 强制校验服务器主机公钥，避免 SSH 连接遭遇中间人替换。
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # 私钥只加载到本次 Actions 临时 ssh-agent，不写入工作区。
          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k' EXIT
          ssh-add - <<< "$SSH_PRIVATE_KEY"

          ssh -o StrictHostKeyChecking=yes -p "$SSH_PORT" "$SSH_USERNAME@$SSH_HOST" 'bash -se' <<EOF
          set -euo pipefail
          umask 077
          # 无论远程命令成功或失败，退出时都删除含数据库凭据的临时文件。
          trap 'rm -f /tmp/jinyu-planet-deploy.env' EXIT

          echo "===== writing temporary deployment environment ====="
          # Compose 使用此临时文件插值镜像标签和生产数据库连接串，服务器不持久化 .env。
          cat > /tmp/jinyu-planet-deploy.env <<ENVEOF
          JINYU_PLANET_IMAGE=$IMAGE:$TAG
          JINYU_PLANET_MIGRATE_IMAGE=$IMAGE:$TAG-migrate
          DATABASE_URL=$DATABASE_URL
          SHADOW_DATABASE_URL=$SHADOW_DATABASE_URL
          QWEN_API_KEY=$QWEN_API_KEY
          QWEN_BASE_URL=$QWEN_BASE_URL
          QWEN_MODEL=$QWEN_MODEL
          QWEN_TIMEOUT_MS=$QWEN_TIMEOUT_MS
          QWEN_DEEP_THINKING_ENABLED=$QWEN_DEEP_THINKING_ENABLED
          QWEN_WEB_SEARCH_ENABLED=$QWEN_WEB_SEARCH_ENABLED
          ALI_OSS_BUCKET=$ALI_OSS_BUCKET
          ALI_OSS_REGION=$ALI_OSS_REGION
          ALI_OSS_ENDPOINT=$ALI_OSS_ENDPOINT
          ALI_OSS_ACCESS_KEY_ID=$ALI_OSS_ACCESS_KEY_ID
          ALI_OSS_ACCESS_KEY_SECRET=$ALI_OSS_ACCESS_KEY_SECRET
          ENVEOF
          chmod 600 /tmp/jinyu-planet-deploy.env

          echo "===== logging in to GHCR ====="
          # 私有 GHCR 镜像需要服务器以只读 packages Token 登录后才能拉取。
          printf '%s' '$GHCR_TOKEN' | docker login -u '$GHCR_USERNAME' --password-stdin ghcr.io
          # Nginx 与应用容器共用 web 网络；不存在时创建一次。
          docker network inspect web > /dev/null 2>&1 || docker network create web

          echo "===== pulling application and migration images ====="
          # 先拉取本次提交对应的运行与迁移镜像，避免误用 latest。
          docker compose --profile migration --env-file /tmp/jinyu-planet-deploy.env -f /opt/stack/jinyu-planet/docker-compose.yml pull jinyu-planet migrate

          echo "===== applying database migrations ====="
          # 必须重定向到空输入：否则 migrate 会继承 SSH here-document 输入并读走后续启动命令。
          docker compose --profile migration --env-file /tmp/jinyu-planet-deploy.env -f /opt/stack/jinyu-planet/docker-compose.yml run --rm migrate < /dev/null

          echo "===== starting application container ====="
          # migration 成功后才更新常驻 Nuxt 应用容器。
          docker compose --env-file /tmp/jinyu-planet-deploy.env -f /opt/stack/jinyu-planet/docker-compose.yml up -d --remove-orphans jinyu-planet

          echo "===== application container status ====="
          # 若容器启动后立即退出，打印应用日志并让 CI/CD 失败，防止出现“部署成功但无法访问”。
          docker compose --env-file /tmp/jinyu-planet-deploy.env -f /opt/stack/jinyu-planet/docker-compose.yml ps jinyu-planet
          if ! docker compose --env-file /tmp/jinyu-planet-deploy.env -f /opt/stack/jinyu-planet/docker-compose.yml ps --status running --services | grep -qx jinyu-planet; then
            echo "jinyu-planet did not remain running; recent application logs follow."
            docker compose --env-file /tmp/jinyu-planet-deploy.env -f /opt/stack/jinyu-planet/docker-compose.yml logs --tail=100 jinyu-planet
            exit 1
          fi

          echo "===== verifying AI runtime configuration ====="
          # 只打印是否存在密钥和开关字面值，不输出任何凭据；部署成功即能确认容器实际收到的配置。
          docker compose --env-file /tmp/jinyu-planet-deploy.env -f /opt/stack/jinyu-planet/docker-compose.yml exec -T jinyu-planet node -e '
            const config = {
              hasQwenApiKey: Boolean(process.env.QWEN_API_KEY?.trim()),
              deepThinkingEnabled: process.env.QWEN_DEEP_THINKING_ENABLED ?? null,
              webSearchEnabled: process.env.QWEN_WEB_SEARCH_ENABLED ?? null,
              hasOssBucket: Boolean(process.env.ALI_OSS_BUCKET?.trim()),
              hasOssRegion: Boolean(process.env.ALI_OSS_REGION?.trim()),
              hasOssEndpoint: Boolean(process.env.ALI_OSS_ENDPOINT?.trim()),
              hasOssAccessKeyId: Boolean(process.env.ALI_OSS_ACCESS_KEY_ID?.trim()),
              hasOssAccessKeySecret: Boolean(process.env.ALI_OSS_ACCESS_KEY_SECRET?.trim())
            };
            console.log(JSON.stringify(config));
            if (!config.hasQwenApiKey || !["true", "false"].includes(config.deepThinkingEnabled) || !["true", "false"].includes(config.webSearchEnabled) || !config.hasOssBucket || !config.hasOssRegion || !config.hasOssEndpoint || !config.hasOssAccessKeyId || !config.hasOssAccessKeySecret) process.exit(1);
          '

          echo "===== reloading reverse proxy ====="
          # 复用已有 Nginx 服务；IP:3000 预览不依赖 Nginx，但正式域名访问会使用它。
          docker compose -f /opt/stack/nginx/docker-compose.yml up -d --remove-orphans

          echo "===== pruning unused Docker images ====="
          # 新版本已确认运行后，删除所有未被容器使用的旧镜像（包含带 SHA 标签的运行镜像和迁移镜像）。
          # 正在运行的应用、Nginx 等容器所依赖的镜像会被 Docker 自动保留。
          docker image prune -a -f
          EOF
